[project]
name = "jfordemwalt-alchemy"
version = "0.1.0"
description = "Skyrim alchemy potion simulator"
authors = [{ name = "James Fordemwalt", email = "jffordem@gmail.com" }]
readme = "readme.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask>=3.0.3,<4.0.0",
    "pymongo>=4.10.1,<5.0.0",
    "pandas>=2.2.3,<3.0.0",
    "rich>=13.9.4,<14.0.0",
    "uvicorn>=0.32.0,<0.33.0",
    "pydantic>=2.9.2,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "requests>=2.32.3,<3.0.0",
    "beautifulsoup4>=4.13.3,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<10.0.0",
    "invoke>=2.2.0,<3.0.0",
]

[tool.uv]
package = false
